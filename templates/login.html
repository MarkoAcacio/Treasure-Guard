{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block auth %}
<div class="card">
  <h1>Log in</h1>
  <p class="muted">Owners go to their dashboard. Employees go straight to uploading files.</p>
  {% if error %}<div class="notice error" role="alert"><p>{{ error }}</p></div>{% endif %}
  <form method="post">
    <div class="field"><label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required value="{{ form.get('email', '') }}"></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
</div>
<div class="auth-links">
  <span class="muted">New here?</span>
  <a href="{{ url_for('signup_page') }}">Create a business account</a>
  <span class="muted" aria-hidden="true">·</span>
  <a href="{{ url_for('signup_page', **{'as': 'employee'}) }}">Join as an employee</a>
</div>
{% endblock %}
